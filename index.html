<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Visualizing Sorting Algorithms</title>
        <!-- Poppins Font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <!-- Favicon -->
        <link rel="icon" href="favicon.ico" type="image/png" />
        <!-- TailwindCSS -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- Custom CSS -->
        <link rel="stylesheet" href="stylesheets/style.css" />
    </head>
    <body
        class="flex flex-col items-center p-5 bg-slate-900 text-gray-400 text-center"
    >
        <!-- Title -->
        <h1 class="text-4xl text-white">Visualizing Sorting Algorithms</h1>

        <!-- Main -->
        <main
            class="flex flex-col items-center p-5 my-5 w-full lg:w-6xl rounded-md bg-slate-800"
        >
            <div class="flex flex-col md:flex-row w-full gap-3">
                <!-- Canvas -->
                <div
                    class="flex justify-center items-end p-1 w-full lg:w-4xl rounded-md bg-slate-700 h-90"
                    id="canvas"
                ></div>

                <div class="flex flex-col w-full md:w-3xs gap-3">
                    <!-- Current results -->
                    <div
                        class="flex flex-col justify-around p-3 w-full h-50 md:h-1/2 rounded-md bg-slate-700"
                    >
                        <h1 class="text-lg text-white">Current report</h1>

                        <div class="flex gap-2 ps-4">
                            <div class="text-end">
                                <p>Algorithm</p>
                                <p>Data size</p>
                                <p>delay</p>
                                <p>time</p>
                            </div>

                            <div class="text-start text-white">
                                <p id="algorithmReportCurrent">-</p>
                                <p id="dataSizeReportCurrent">-</p>
                                <p id="delayReportCurrent">-</p>
                                <p id="timeReportCurrent">-</p>
                            </div>
                        </div>
                    </div>

                    <!-- Previous results -->
                    <div
                        class="flex flex-col justify-around p-3 w-full h-50 md:h-1/2 rounded-md bg-slate-700"
                    >
                        <h1 class="text-lg text-white">Previous report</h1>

                        <div class="flex gap-2 ps-4">
                            <div class="text-end">
                                <p>Algorithm</p>
                                <p>Data size</p>
                                <p>delay</p>
                                <p>time</p>
                            </div>

                            <div class="text-start text-white">
                                <p id="algorithmReportPrevious">-</p>
                                <p id="dataSizeReportPrevious">-</p>
                                <p id="delayReportPrevious">-</p>
                                <p id="timeReportPrevious">-</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <form class="mt-3">
                <div class="flex justify-center flex-wrap gap-3">
                    <!-- Data Size -->
                    <div class="flex flex-col gap-1">
                        <label for="dataSize">Data Size</label>
                        <input
                            class="w-50 p-1 rounded-md text-center bg-slate-700"
                            type="number"
                            id="dataSize"
                            name="dataSize"
                            min="1"
                            max="1000"
                            value="100"
                        />
                    </div>

                    <!-- Delay -->
                    <div class="flex flex-col gap-1">
                        <label for="delay">Delay in MS</label>
                        <input
                            class="w-50 p-1 rounded-md text-center bg-slate-700"
                            type="number"
                            id="delay"
                            name="delay"
                            min="1"
                            max="1000"
                            value="10"
                        />
                    </div>

                    <!-- Algorithm type -->
                    <div class="flex flex-col gap-1">
                        <label for="chosenAlgorithm">Algorithm</label>
                        <select
                            class="w-50 p-1 rounded-md text-center bg-slate-700 text-white"
                            name="algorithmType"
                            id="algorithmType"
                        >
                            <option value="selectionSort">
                                Selection Sort
                            </option>
                        </select>
                    </div>
                </div>

                <!-- Submit -->
                <input
                    type="submit"
                    value="Sort!"
                    class="p-3 px-6 mt-3 rounded-md text-white bg-sky-600 customHover"
                    id="submitButton"
                />
            </form>
        </main>

        <!-- Footer -->
        <footer class="text-gray-500">
            &copy; 2025
            <a
                class="underline underline-2"
                href="https://vdburg.site/"
                target="_blank"
                >Son Bram van der Burg</a
            >
            | Made with TailwindCSS
        </footer>

        <!-- JavaScript -->
        <script type="module" src="scripts/main.js"></script>
    </body>
</html>
